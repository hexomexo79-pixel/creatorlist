<style>
:root {
  --bg: #ffffff;
  --text: #111111;
  --muted: #666666;
  --header: #e3a63b;
  --link: #b06f00;

  --rate: #9ba1aa;
  --featured: #c0773b;
  --epic: #f0c22e;
  --legendary: #e15bd7;
  --mythic: #4fd0ea;
  --panel: #f1f1f1;
  --tipbg: #ffffff;
  --tipline: #777777;
  --zero: #ffffff;
  --grid1: #dddddd;
  --grid2: #eeeeee;
  --axis: #999999;
  --charttext: #555555;
  color-scheme: light;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
}

.wrap {
  max-width: 800px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header { background: var(--header); }
header .wrap {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  padding-block: 10px;
}
.logo { color: white; font-weight: 700; font-size: 20px; text-decoration: none; }
.logo small { font-size: 11px; font-weight: 400; opacity: .7; }
header nav { display: flex; gap: 20px; }
header nav a { color: white; text-decoration: none; padding-bottom: 4px; }

main { padding-block: 20px 40px; }
h1 { font-size: 34px; margin: 0 0 12px; }
h2 { font-size: 22px; margin: 28px 0 10px; }

a.name { display: block; box-sizing: border-box; width: 170px; padding: 9px 12px; color: var(--text); text-decoration: none; background: transparent; font-weight: 700; -webkit-tap-highlight-color: transparent; }
a.name:not(.plain)::after { content: "\203A"; float: right; font-size: 20px; line-height: 15px; }
a.name:hover, a.name:active { background: var(--accent, #e3a63b); color: var(--on, #fff); }
.nolink { display: block; box-sizing: border-box; padding: 9px 12px; font-weight: 700; }
a.name.first { background: var(--accent, #e3a63b); color: var(--on, #fff); }
a.name.first:hover, a.name.first:active { filter: brightness(.88); }
.list td.left { width: 190px; white-space: nowrap; }
a.name.plain { display: inline; width: auto; background: none; border: 0; padding: 0; font-weight: 400; color: var(--link); text-decoration: underline; }
a.name.plain:hover, a.name.plain:active { background: none; color: var(--link); }
.prof h1 { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; width: fit-content; min-width: min(100%, 340px); max-width: 100%; background: var(--accent, #e3a63b); color: var(--on, #fff); padding: 6px 16px; margin: 4px 0 14px; }
.prof h2 { display: table; background: var(--accent, #e3a63b); color: var(--on, #fff); padding: 4px 12px; font-size: 18px; margin: 28px 0 12px; }

.btn {
  display: inline-block;
  background: var(--header);
  color: white;
  padding: 6px 12px;
  text-decoration: none;
  margin-right: 6px;
}

.muted { color: var(--muted); }
.editor { margin: 6px 0; display: flex; align-items: center; gap: 8px; }
.editor svg { width: 18px; height: 18px; }
.small { font-size: 13px; }

.tablebox { overflow-x: auto; }
table { border-collapse: collapse; }
.list { width: 100%; min-width: 680px; }
.list th { text-align: center; font-size: 13px; padding: 6px; }
.list td { padding: 7px 6px; text-align: center; }
.list .left { text-align: left; }
.list .c { width: 84px; min-width: 84px; max-width: 84px; box-sizing: border-box; }
.list td.c { color: #111; font-weight: 600; }
.list td.c:not([style]) { color: var(--text); }
.list th[style*="background"], .list th.pts { color: #111; }
.list .pts { color: #111; background: var(--epic); font-size: 22px; font-weight: 700; padding-left: 12px; padding-right: 16px; }
.list th.pts { font-size: 14px; }
.list td.c.zero { background: var(--zero) !important; color: var(--text); font-weight: 400; }
.list .rk { font-weight: 700; }

.info td { padding: 3px 18px 3px 0; }
.info td:first-child { font-weight: 700; text-transform: uppercase; }
.tag { display: inline-block; font-size: 12px; color: white; padding: 2px 7px; margin: 10px 4px 0 0; }
@media (min-width: 900px) {
  body.home header .wrap, body.home main.wrap { max-width: 1040px; }
  .homegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; align-items: start; }
  .homegrid > div:last-child > h2:first-child { margin-top: 12px; }
}
.rolebox { background: var(--panel); padding: 14px; }
.rolebox .rolerow { display: flex; flex-wrap: wrap; gap: 8px; }
.rolebox .rolerow + .rolerow { margin-top: 14px; }
.rolebox.special { display: grid; grid-template-columns: max-content 1fr; gap: 12px 16px; align-items: center; }
.rolebox.special .tag { justify-self: start; }
.rolebox.special p { margin: 0; font-size: 14px; }
.rolebox .tag { font-size: 14px; padding: 5px 10px; }
.facts p { margin: 6px 0; }
.facts ul { margin: 0; padding-left: 20px; }
.facts li { margin: 5px 0; }

.tip { cursor: pointer; }
#tip { display: none; position: absolute; z-index: 10; background: var(--tipbg); color: var(--text); border: 1px solid var(--tipline); padding: 8px 12px; font-size: 14px; max-width: 280px; pointer-events: none; }
#tip b { display: inline-block; color: #111; padding: 2px 8px; margin-bottom: 6px; }
#tip div { padding: 2px 0; }
#tip .sw { display: inline-block; width: 10px; height: 10px; margin-right: 7px; }

</style>

<header>
  <div class="wrap">
    <a class="logo" href="#home">Goldenfyre CL <small>v1.3b</small></a>
    <nav>
      <a href="#list" id="nav-list">List</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
const TYPES = [
  { key: "rate",      name: "Rates",     pts: 1 },
  { key: "featured",  name: "Features",  pts: 2 },
  { key: "epic",      name: "Epics",     pts: 3 },
  { key: "legendary", name: "Legendary", pts: 4 },
  { key: "mythic",    name: "Mythics",   pts: 5 },
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}
function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

const weeklyCreators = new Set(WEEKLY_LEVELS.map(l => l[1]));
const all = CREATORS.map((c, i) => {
  const out = Object.assign({}, c, { order: i, levels: 0, points: 0, slug: slug(c.name),
    weekly: weeklyCreators.has(c.name) });
  out.gauntletCreator = Object.keys(c.gauntlets || {}).length > 0;
  out.mappackCreator = !!c.mappack || Object.keys(c.packs || {}).length > 0;
  out.expert = (Number(c.legendary) || 0) + (Number(c.mythic) || 0) > 0;
  TYPES.forEach(t => {
    const n = Number(c[t.key]) || 0;
    out[t.key] = n;
    out.levels += n;
    out.points += n * t.pts;
  });
  return out;
});
const ranked = all
  .slice()
  .sort((a, b) => b.points - a.points || a.levels - b.levels || a.order - b.order);
ranked.forEach((c, i) => {
  c.rank = i + 1;
  c.hasPage = c.rank <= 10 || c.page === true;
});

const LEVEL_KEY = { R: "rate", F: "featured", E: "epic", L: "legendary", M: "mythic" };
const levelsOf = {};
const allLevelsOf = {};
RATING_LOG.slice().reverse().forEach(r => {
  const key = LEVEL_KEY[r[2]];
  if (!levelsOf[r[1]]) levelsOf[r[1]] = {};
  if (!levelsOf[r[1]][key]) levelsOf[r[1]][key] = [];
  levelsOf[r[1]][key].push(r[0]);
  if (!allLevelsOf[r[1]]) allLevelsOf[r[1]] = [];
  allLevelsOf[r[1]].push([r[0], key]);
});
function levelsCell(c) {
  return `<td class="c${c.levels ? " tip" : ""}"${c.levels ? ` data-c="${esc(c.name)}" data-t="all"` : ""}>${c.levels}</td>`;
}
function tierCell(c, t) {
  const n = c[t.key];
  return `<td class="c${n ? " tip" : " zero"}" style="background:var(--${t.key})"${n ? ` data-c="${esc(c.name)}" data-t="${t.key}"` : ""}>${n}</td>`;
}

const RECORDS = [
  { name: "Most Rates",    get: c => c.rate,      color: "rate" },
  { name: "Most Features", get: c => c.featured,  color: "featured" },
  { name: "Most Epics",    get: c => c.epic,      color: "epic" },
  { name: "Most Legendaries", get: c => c.legendary, color: "legendary" },
  { name: "Most Mythics",  get: c => c.mythic,    color: "mythic" },
];
RECORDS.forEach(r => r.max = Math.max(...all.map(r.get)));

const SPECIAL_ROLES = [
  { name: "Top 1 Level", flag: "top1Demon", bg: "linear-gradient(90deg,#fff3a3,#ffb81f,#f0542b)", dark: true,
    how: "For creators who have made a top 1 level, past and present." },
  { name: "Gauntlet Creator", flag: "gauntletCreator", bg: "linear-gradient(90deg,#0b3d91,#1580d8,#00cfe8)",
    how: "For creators whose level got into a gauntlet." },
  { name: "Mappack Creator", flag: "mappackCreator", bg: "linear-gradient(90deg,#ff2e93,#ff7a1a,#ffd23f)", dark: true,
    how: "For creators who have a level in a map pack." },
  { name: "Monthly Awards", flag: "monthly", bg: "linear-gradient(90deg,#ffd23f,#8fdc4a,#1fbf75)", dark: true,
    how: "For the winners of the monthly awards, hosted by Syne." },
  { name: "Expert Creator", flag: "expert", bg: "linear-gradient(90deg,#8ad7ff,#ff9ad5)", dark: true,
    how: "For creators who have made a legendary or higher level." },
];


const ACHIEVEMENT_ROLES = [
  { name: "Top 1 Creator",              bg: "#d9473c" },
  { name: "Former Top 1 Creator",       bg: "#f27c1a" },
  { name: "Weekly Demon",               bg: "#9b3dff" },
  { name: "Most Liked Level",           bg: "#22c55e" },
];
const RECORD_ROLES = [
  { name: "Most Rates",                 color: "rate" },
  { name: "Most Features",              color: "featured" },
  { name: "Most Epics",                 color: "epic" },
  { name: "Most Legendaries",           color: "legendary" },
  { name: "Most Mythics",               color: "mythic" },
];

function onColor(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (hex.toLowerCase() === DEFAULT_COLOR.toLowerCase()) return "#fff";
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111" : "#fff";
}
function accentStyle(c) {
  const col = c.color || DEFAULT_COLOR;
  return `--accent:${col};--on:${onColor(col)}`;
}

const app = document.getElementById("app");

function homePage() {
  app.innerHTML = `
    <div class="homegrid"><div>
    <h1>Goldenfyre Creatorlist</h1>
    <p>The official creator point list for the Goldenfyre GDPS.</p>
    <p style="margin:18px 0">
      <a class="btn" href="#list">Creatorlist</a>
      
    </p>
    <h2>List Editors</h2>
    <p class="editor"><svg viewBox="0 0 24 24" aria-label="Owner"><path fill="currentColor" d="M2 7l5 4 5-7 5 7 5-4-2 12H4z"/></svg>Syne_49378</p>
    <p class="editor"><svg viewBox="0 0 24 24" aria-label="Helper"><circle cx="9" cy="7" r="4" fill="currentColor"/><path fill="currentColor" d="M1 21c0-4.4 3.6-8 8-8 1.5 0 2.9.4 4.1 1.1A6 6 0 0 0 12 21z"/><circle cx="18" cy="18" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" d="M18 12.5v2M18 21.5v2M12.5 18h2M21.5 18h2M14.1 14.1l1.4 1.4M20.5 20.5l1.4 1.4M14.1 21.9l1.4-1.4M20.5 15.5l1.4-1.4"/></svg>Mesh9596</p>

    <h2>Edit your profile</h2>
    <p>Want to change your description, facts or profile color? Fill out the form.</p>
    <p style="margin:12px 0"><a class="btn" href="${PROFILE_FORM}" target="_blank" rel="noopener">Profile change form</a></p>

    </div><div>

    <h2>Roles</h2>
    <div class="rolebox">
      <div class="rolerow">${ACHIEVEMENT_ROLES.map(r => `<span class="tag" style="margin:0;${r.color ? `background:var(--${r.color});color:#111` : `background:${r.bg || "#555"}${r.dark ? ";color:#111" : ""}`}">${r.name}</span>`).join("")}</div>
      <div class="rolerow">${RECORD_ROLES.map(r => `<span class="tag" style="margin:0;${r.color ? `background:var(--${r.color});color:#111` : `background:${r.bg || "#555"}${r.dark ? ";color:#111" : ""}`}">${r.name}</span>`).join("")}</div>
    </div>

    <h2>Special Roles</h2>
    <div class="rolebox special">
      ${SPECIAL_ROLES.map(r => `<span class="tag" style="margin:0;background:${r.bg}${r.dark ? ";color:#111" : ""}">${r.name}</span><p>${r.how}</p>`).join("")}
    </div>

    </div></div>`;
  document.title = "Goldenfyre Creatorlist";
}

function listPage() {
  const rows = ranked.map(c => `
    <tr data-n="${esc(c.name.toLowerCase())}">
      <td class="rk">#${c.rank}</td>
      <td class="left">${c.hasPage ? `<a class="name${c.rank === 1 ? " first" : ""}" style="${accentStyle(c)}" href="#${c.slug}">${esc(c.name)}</a>` : `<span class="nolink">${esc(c.name)}</span>`}</td>
      <td class="pts">${c.points}</td>
      ${levelsCell(c)}
      ${TYPES.map(t => tierCell(c, t)).join("")}
    </tr>`).join("");

  app.innerHTML = `
    <h1>Creatorlist</h1>
    <p class="muted small" style="line-height:1.6">Tap a number to see the creator's levels.<br>Last updated: ${esc(LAST_UPDATED)}</p>
    <div class="tablebox" style="margin-top:14px">
      <table class="list">
        <tr>
          <th>Rank</th>
          <th class="left">Creator</th>
          <th class="pts">Creator Points</th>
          <th class="c tip" data-h="levels">Levels</th>
          ${TYPES.map(t => `<th class="c tip" data-h="${t.key}" style="background:var(--${t.key})">${t.name}</th>`).join("")}
        </tr>
        ${rows}
      </table>
    </div>`;
  document.title = "Creatorlist - GCL";
}

function profilePage(c) {
  const facts = [];
  if (c.since) facts.push("Creator since " + c.since);
  if (c.bestLevel) facts.push("Best level: " + c.bestLevel);
  (c.facts || []).forEach(f => facts.push(f));

  app.innerHTML = `
    <div class="prof" style="${accentStyle(c)}">
    <p><a class="name plain small" href="#list">&lt; Back to list</a></p>
    <h1><span>${esc(c.name)}</span><span class="rk">#${c.rank}</span></h1>
    <table class="info">
      <tr><td>Creator Points</td><td>${c.points}</td></tr>
    </table>
    ${SPECIAL_ROLES.some(r => c[r.flag]) ? `<div>${SPECIAL_ROLES.filter(r => c[r.flag]).map(r => `<span class="tag" style="background:${r.bg}${r.dark ? ";color:#111" : ""}">${r.name}</span>`).join("")}</div>` : ""}
    <div style="margin-top:${SPECIAL_ROLES.some(r => c[r.flag]) ? "4px" : "0"}">
    ${c.rank === 1 ? `<span class="tag" style="background:#d9473c">Top 1 Creator</span>` : ""}
    ${c.rank !== 1 && everTop1.has(c.name) ? `<span class="tag" style="background:#f27c1a">Former Top 1 Creator</span>` : ""}
    ${c.weekly ? `<span class="tag" style="background:#9b3dff">Weekly Demon</span>` : ""}
    ${c.mostLiked ? `<span class="tag" style="background:#22c55e">Most Liked Level</span>` : ""}
    ${RECORDS.filter(r => r.max > 0 && r.get(c) === r.max).map(r => `<span class="tag" style="${r.color ? `background:var(--${r.color});color:#111` : "background:#555"}">${r.name}</span>`).join("")}
    </div>
    ${c.description ? `<p style="margin-top:16px">${esc(c.description)}</p>` : ""}
    ${(() => {
      const chip = (i, extra) => `<span class="tag${extra ? " tip" : ""}" ${extra || ""} style="margin:0;font-size:12px;padding:3px 8px;background:${i.bg}${i.dark ? ";color:#111" : ""}">${esc(i.name)}</span>`;
      const chips = Object.keys(c.gauntlets || {}).map(n => GAUNTLETS.find(g => g.name === n)).filter(Boolean).map(g => chip(g, `data-p="${esc(g.name)}" data-c="${esc(c.name)}"`))
        .concat(Object.keys(c.packs || {}).map(n => MAPPACKS.find(p => p.name === n)).filter(Boolean)
          .map(p => chip(p, `data-p="${esc(p.name)}" data-c="${esc(c.name)}"`)));
      return chips.length ? `<h2>Gauntlets &amp; Map Packs</h2><div style="display:flex;flex-wrap:wrap;gap:6px">${chips.join("")}</div>` : "";
    })()}

    <h2>Levels</h2>
    <div class="tablebox">
      <table class="list" style="width:auto;min-width:0">
        <tr><th class="c">Levels</th>${TYPES.map(t => `<th class="c" style="background:var(--${t.key})">${t.name}</th>`).join("")}</tr>
        <tr>${levelsCell(c)}${TYPES.map(t => tierCell(c, t)).join("")}</tr>
      </table>
    </div>

    <h2>Facts</h2>
    <div class="facts">
      ${facts.length ? `<ul>${facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : `<p class="muted">No facts yet.</p>`}
    </div>
    </div>`;
  document.title = c.name + " - GCL";
}

const PTS = { R: 1, F: 2, E: 3, L: 4, M: 5 };
const everTop1 = new Set();
(() => {
  const order = {}, pts = {}, lvls = {};
  CREATORS.forEach((c, i) => order[c.name] = i);
  RATING_LOG.map((r, i) => ({ r, i }))
    .sort((a, b) => (a.r[3] || "").localeCompare(b.r[3] || "") || a.i - b.i)
    .forEach(({ r }) => {
      pts[r[1]] = (pts[r[1]] || 0) + (PTS[r[2]] || 0);
      lvls[r[1]] = (lvls[r[1]] || 0) + 1;
      everTop1.add(Object.keys(pts).sort((x, y) =>
        pts[y] - pts[x] || lvls[x] - lvls[y] || (order[x] ?? 999) - (order[y] ?? 999))[0]);
    });
})();

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  document.body.classList.toggle("home", !h || h === "home");
  document.getElementById("nav-list").className = (h && h !== "home") ? "on" : "";

  if (!h || h === "home") homePage();
  else if (h === "list") listPage();
  else {
    const c = all.find(x => x.slug === h && x.hasPage);
    if (c) profilePage(c);
    else app.innerHTML = `<p>That creator doesn't have a page yet. <a class="name plain" href="#list">Back to list</a></p>`;
  }
  window.scrollTo(0, 0);
}

const tip = document.createElement("div");
tip.id = "tip";
document.body.appendChild(tip);
let tipCell = null;
const canHover = window.matchMedia("(hover: hover)").matches;

function hideTip() { tip.style.display = "none"; tipCell = null; }
function placeTip(x, y) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 16, top = y + 16;
  if (left + w > window.innerWidth - 8) left = x - w - 16;
  if (top + h > window.innerHeight - 8) top = y - h - 16;
  left = Math.max(8, left); top = Math.max(8, top);
  tip.style.left = (left + window.scrollX) + "px";
  tip.style.top = (top + window.scrollY) + "px";
}
function showTip(td, e) {
  if (td.dataset.h) {
    if (td.dataset.h === "levels") {
      const src = all;
      const total = src.reduce((sum, c) => sum + c.levels, 0);
      tip.innerHTML = `<b style="background:#e6e6e6">Levels</b><div>Total on the server: ${total}</div>`;
    } else {
      const t = TYPES.find(x => x.key === td.dataset.h);
      const src = all;
      const total = src.reduce((sum, c) => sum + c[t.key], 0);
      const most = Math.max(0, ...src.map(c => c[t.key]));
      const names = src.filter(c => c[t.key] === most).map(c => c.name);
      tip.innerHTML = `<b style="background:var(--${t.key})">${t.name}</b><div>Total on the server: ${total}</div>` +
        (most > 0 ? `<div>Most: ${names.map(esc).join(", ")} (${most})</div>` : `<div>Most: nobody yet</div>`);
    }
  } else if (td.dataset.p) {
    const pk = MAPPACKS.concat(GAUNTLETS).find(p => p.name === td.dataset.p);
    const cr = all.find(x => x.name === td.dataset.c);
    const lv = (cr && ((cr.packs && cr.packs[pk.name]) || (cr.gauntlets && cr.gauntlets[pk.name]))) || [];
    tip.innerHTML = `<b style="background:${pk.bg};color:${pk.dark ? "#111" : "#fff"}">${esc(pk.name)} (${lv.length})</b>` + lv.map(n => `<div>${esc(n)}</div>`).join("");
  } else if (td.dataset.t === "all") {
    const list = allLevelsOf[td.dataset.c] || [];
    tip.innerHTML = `<b style="background:#e6e6e6">Levels (${list.length})</b>` +
      list.map(l => `<div><span class="sw" style="background:var(--${l[1]})"></span>${esc(l[0])}</div>`).join("");
  } else {
    const names = ((levelsOf[td.dataset.c] || {})[td.dataset.t]) || [];
    const t = TYPES.find(x => x.key === td.dataset.t);
    tip.innerHTML = `<b style="background:var(--${t.key})">${t.name} (${names.length})</b>` +
      names.map(n => `<div>${esc(n)}</div>`).join("");
  }
  tip.style.display = "block";
  tipCell = td;
  if (canHover && e) placeTip(e.clientX, e.clientY);
  else {
    const r = td.getBoundingClientRect();
    placeTip(r.left - 16, r.bottom - 12);
  }
}
document.addEventListener("click", e => {
  const td = e.target.closest(".tip");
  if (td) { if (!canHover && tipCell === td) hideTip(); else if (!canHover) showTip(td, e); }
  else if (!e.target.closest("#tip")) hideTip();
});
if (canHover) {
  document.addEventListener("mouseover", e => {
    const td = e.target.closest(".tip");
    if (td) { if (td !== tipCell) showTip(td, e); }
    else if (!e.target.closest("#tip")) hideTip();
  });
  document.addEventListener("mousemove", e => { if (tipCell) placeTip(e.clientX, e.clientY); });
}

window.addEventListener("hashchange", () => { hideTip(); route(); });
route();
</script>
