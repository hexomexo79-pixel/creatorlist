:root {
  --bg: #ffffff;

}

body {
  background: var(--bg);
  color: var(--text);

  font-size: 15px;
}

.wrap {
  max-width: 800px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}

header { background: var(--header); }
header .wrap {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  padding-block: 10px;
}
.logo { color: white; font-weight: 700; font-size: 20px; text-decoration: none; }
.logo small { font-size: 11px; font-weight: 400; opacity: .7; }
header nav { display: flex; gap: 20px; }
header nav a { color: white; text-decoration: none; padding-bottom: 4px; }
header nav span { color: white; opacity: .55; }

main { padding-block: 20px 40px; }
h1 { font-size: 34px; margin: 0 0 12px; }
h2 { font-size: 22px; margin: 28px 0 10px; }

a.name { color: var(--link); text-decoration: underline; }

.btn {
  display: inline-block;
  background: var(--header);
  color: white;
  padding: 6px 12px;
  text-decoration: none;
  margin-right: 6px;
}
.btn.off { background: #dddddd; color: #888888; }

.muted { color: var(--muted); }
.editor { margin: 6px 0; display: flex; align-items: center; gap: 8px; }
.editor svg { width: 18px; height: 18px; }
.small { font-size: 13px; }

/* list */
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; }
.list { width: 100%; min-width: 680px; }
.list th { text-align: center; font-size: 13px; padding: 6px; }
.list td { padding: 7px 6px; text-align: center; }
.list .left { text-align: left; }
.list .c { width: 84px; min-width: 84px; max-width: 84px; box-sizing: border-box; }
.list td.c { color: #111; font-weight: 600; }

.list th.pts { font-size: 14px; }
.list td.c.zero { background: #fff !important; color: #111; font-weight: 400; }
.list .rk { font-weight: 700; }

.info td { padding: 3px 18px 3px 0; }

.tag { display: inline-block; font-size: 12px; color: white; padding: 2px 7px; margin: 10px 4px 0 0; }
.cats { display: flex; flex-wrap: wrap; gap: 8px 26px; }
.cats div { text-align: center; }
.cats b { display: block; text-transform: uppercase; font-size: 13px; padding: 3px 8px; margin-bottom: 4px; color: #111; }
.facts p { margin: 6px 0; }
.facts ul { margin: 0; padding-left: 20px; }

<script>
const TYPES = [
  { key: "rate",      name: "Rates",     pts: 1 },
  { key: "featured",  name: "Features",  pts: 2 },
  { key: "epic",      name: "Epics",     pts: 3 },
  { key: "legendary", name: "Legendary", pts: 4 },
  { key: "mythic",    name: "Mythics",   pts: 5 },
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}
function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

// work out points, levels and ranks
const all = CREATORS.map((c, i) => {
  const out = Object.assign({}, c, { order: i, levels: 0, points: 0, slug: slug(c.name) });
  TYPES.forEach(t => {
    const n = Number(c[t.key]) || 0;
    out[t.key] = n;
    out.levels += n;
    out.points += n * t.pts;
  });
  return out;
});
const ranked = all
  .slice()
  .sort((a, b) => b.points - a.points || a.levels - b.levels || a.order - b.order);
ranked.forEach((c, i) => {
  c.rank = i + 1;
  c.hasPage = c.rank <= 10 || c.page === true;
});

// record roles, worked out automatically (ties all get the role)
const RECORDS = [
  { name: "Most Levels",   get: c => c.levels },
  { name: "Most Rates",    get: c => c.rate,      color: "rate" },
  { name: "Most Features", get: c => c.featured,  color: "featured" },
  { name: "Most Epics",    get: c => c.epic,      color: "epic" },
  { name: "Most Legendaries", get: c => c.legendary, color: "legendary" },

// ---------- history ----------
const LINE_COLORS = ["#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4",
  "#42d4f4", "#f032e6", "#9a6324", "#808000", "#000075"];
const PTS = { R: 1, F: 2, E: 3, L: 4, M: 5 };

function parseDay(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDay(dt) {
  return (dt.getMonth() + 1) + "/" + dt.getDate() + "/" + String(dt.getFullYear()).slice(2);
}

function buildHistory() {
  const start = parseDay(FIRST_RATE).getTime();
  const end = parseDay(LAST_RATE).getTime();
  const n = RATING_LOG.length;
  // spread levels out so the rating rate grows linearly up to GROWTH x
  const g = GROWTH - 1;
  const spread = f => g === 0 ? f : (-1 + Math.sqrt(1 + 2 * g * f * (1 + g / 2))) / g;
  const guess = RATING_LOG.map((r, i) => start + (end - start) * spread(n > 1 ? i / (n - 1) : 0));
  // pin dated lines, and stretch the undated ones between pins
  const pins = [{ i: 0, t: start }];
  RATING_LOG.forEach((r, i) => { if (r[3]) pins.push({ i, t: parseDay(r[3]).getTime() }); });
  pins.push({ i: n - 1, t: end });
  const times = guess.slice();
  for (let k = 0; k < pins.length - 1; k++) {
    const a = pins[k], b = pins[k + 1];
    const ga = guess[a.i], gb = guess[b.i];
    for (let i = a.i; i <= b.i; i++) {
      times[i] = RATING_LOG[i][3] ? parseDay(RATING_LOG[i][3]).getTime()
        : a.t + (b.t - a.t) * (gb === ga ? 0 : (guess[i] - ga) / (gb - ga));
    }
  }
  const events = RATING_LOG.map((r, i) => ({
    level: r[0], creator: r[1], type: r[2], time: times[i],
  })).sort((a, b) => a.time - b.time);

  const order = {};
  CREATORS.forEach((c, i) => order[c.name] = i);
  const pts = {}, lvls = {};
  const series = {};
  CREATORS.forEach(c => series[c.name] = [{ t: start, v: 0 }]);
  const top1 = [];

  events.forEach(e => {
    pts[e.creator] = (pts[e.creator] || 0) + (PTS[e.type] || 0);
    lvls[e.creator] = (lvls[e.creator] || 0) + 1;
    if (series[e.creator]) series[e.creator].push({ t: e.time, v: pts[e.creator] });

    const leader = Object.keys(pts).sort((a, b) =>
      pts[b] - pts[a] || lvls[a] - lvls[b] || (order[a] ?? 999) - (order[b] ?? 999))[0];
    const last = top1[top1.length - 1];
    if (!last || last.name !== leader) {
      if (last) last.to = e.time;
      top1.push({ name: leader, from: e.time, to: null });
    }
  });
  // the chart runs up to today, so the current top 1's reign keeps counting
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const lastEvent = events.length ? events[events.length - 1].time : end;
  return { start, end: Math.max(end, today, lastEvent), series, top1, pts, undated: RATING_LOG.filter(r => !r[3]).length };
}

let histShown = HISTORY_CREATORS.slice();   // who is on the chart (resets on reload)
const histColor = {};
function colorFor(name) {
  if (!histColor[name]) {
    const used = histShown.filter(n => n !== name).map(n => histColor[n]);
    histColor[name] = LINE_COLORS.find(c => !used.includes(c)) || LINE_COLORS[Object.keys(histColor).length % LINE_COLORS.length];
  }
  return histColor[name];
}

function historyPage() {
  const H = buildHistory();
  histShown.forEach(colorFor);

  const rows = H.top1.slice().reverse().map(seg => {
    const to = seg.to ?? H.end;
    const days = Math.max(1, Math.round((to - seg.from) / 86400000));
    return `<tr><td><b>${esc(seg.name)}</b></td><td>${fmtDay(new Date(seg.from))}</td><td>${seg.to ? fmtDay(new Date(seg.to)) : "now"}</td><td>${days} day${days === 1 ? "" : "s"}</td></tr>`;
  }).join("");

  app.innerHTML = `
    <h1>History</h1>
    <p class="muted small">Creator points over time, from ${fmtDay(new Date(H.start))} to today (${fmtDay(new Date(H.end))}).</p>
    <div id="chartbox"></div>
    <div id="picker" style="margin:10px 0"></div>

    <h2>Top 1 creators</h2>
    <div class="tablebox">
      <table class="top1">
        <tr><th>Creator</th><th>From</th><th>To</th><th>Held for</th></tr>
        ${rows}
      </table>
    </div>
    ${H.undated ? `<p class="muted small" style="margin-top:14px">Dates for ${H.undated} of ${RATING_LOG.length} ratings are estimated.</p>` : ""}`;
  document.title = "History - GCL";

  function draw() {
    const W = 760, HT = 380, L = 40, R = 12, T = 12, B = 30;
    let maxV = 0;
    histShown.forEach(n => H.series[n].forEach(p => maxV = Math.max(maxV, p.v)));
    const yMax = Math.max(10, Math.ceil(maxV / 10) * 10);
    const step = yMax > 100 ? 20 : 10;
    const x = t => L + (W - L - R) * (t - H.start) / (H.end - H.start || 1);
    const y = v => T + (HT - T - B) * (1 - v / yMax);

    let svg = "";
    for (let v = 0; v <= yMax; v += step) {
      svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd"/>`;
      svg += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    }
    const s0 = new Date(H.start);
    for (let d = new Date(s0.getFullYear(), s0.getMonth() + 1, 1); d.getTime() <= H.end; d.setMonth(d.getMonth() + 1)) {
      const xx = x(d.getTime());
      svg += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${HT - B}" stroke="#eee"/>`;
      svg += `<text x="${xx}" y="${HT - B + 16}" text-anchor="middle">${d.toLocaleString("en-US", { month: "short" })}</text>`;
    }
    svg += `<line x1="${L}" x2="${W - R}" y1="${HT - B}" y2="${HT - B}" stroke="#999"/>`;
    svg += `<line x1="${L}" x2="${L}" y1="${T}" y2="${HT - B}" stroke="#999"/>`;
    histShown.forEach(name => {
      const pts = H.series[name];
      let d = `M${x(pts[0].t)},${y(pts[0].v)}`;
      for (let k = 1; k < pts.length; k++) d += ` H${x(pts[k].t)} V${y(pts[k].v)}`;
      d += ` H${x(H.end)}`;
      svg += `<path d="${d}" fill="none" stroke="${colorFor(name)}" stroke-width="2"/>`;
    });
    const legend = histShown.map(name =>
      `<span><span class="sw" style="background:${colorFor(name)}"></span>${esc(name)} (${H.pts[name] || 0}) <a href="#" class="rm" data-n="${esc(name)}" title="Remove">[x]</a></span>`).join("");
    document.getElementById("chartbox").innerHTML =
      `<svg class="chart" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Creator points over time">${svg}</svg><div class="legend">${legend}</div>`;

    const avail = CREATORS.map(c => c.name).filter(n => !histShown.includes(n) && (H.pts[n] || 0) > 0);
    document.getElementById("picker").innerHTML =
      `Add creator: <select id="addsel">${avail.map(n => `<option>${esc(n)}</option>`).join("")}</select> ` +
      `<button id="addbtn">Add</button> <button id="resetbtn">Reset</button> <button id="clearbtn">Clear</button>`;
    document.querySelectorAll("#chartbox .rm").forEach(a => a.onclick = e => {
      e.preventDefault();
      histShown = histShown.filter(n => n !== a.dataset.n);
      draw();
    });
    document.getElementById("addbtn").onclick = () => {
      const v = document.getElementById("addsel").value;
      if (v) { histShown.push(v); draw(); }
    };
    document.getElementById("clearbtn").onclick = () => { histShown = []; draw(); };
    document.getElementById("resetbtn").onclick = () => { histShown = HISTORY_CREATORS.slice(); draw(); };
  }
  draw();
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  document.getElementById("nav-list").className = (h && h !== "home" && h !== "history") ? "on" : "";
  // v1.1: document.getElementById("nav-history").className = h === "history" ? "on" : "";

  if (!h || h === "home") homePage();
  else if (h === "list") listPage();
  else if (h === "history" && SHOW_HISTORY) historyPage();
  else {
    const c = all.find(x => x.slug === h && x.hasPage);
    if (c) profilePage(c);
    else app.innerHTML = `<p>That creator doesn't have a page yet. <a class="name" href="#list">Back to list</a></p>`;
  }
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
